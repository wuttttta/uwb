name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fixed signing key from repo secrets, so each build installs over the last one
      # and the signing-certificate digest that attestation checks pin stays stable.
      - name: Signing key
        env:
          KS: ${{ secrets.UWB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/uwb.p12"
            echo "keystore: $(wc -c < "$RUNNER_TEMP/uwb.p12") bytes, sha256 $(sha256sum "$RUNNER_TEMP/uwb.p12" | cut -c1-16)"
            echo "UWB_KEYSTORE_FILE=$RUNNER_TEMP/uwb.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No UWB_KEYSTORE_BASE64 secret: throwaway debug key, no release"
          fi

      - name: Test and build
        env:
          UWB_KEYSTORE_PASSWORD: ${{ secrets.UWB_KEYSTORE_PASSWORD }}
          UWB_KEY_ALIAS: ${{ secrets.UWB_KEY_ALIAS }}
        run: ./gradlew test assembleDebug :verifier-cli:installDist --stacktrace

      - name: Signing certificate digest
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256' | tee cert.txt
          cp app/build/outputs/apk/debug/app-debug.apk "uwb-0.1.$GITHUB_RUN_NUMBER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: uwb-apk
          path: uwb-*.apk

      # One release per signed build on main, tag v0.1.<run>: Obtainium tracks releases.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.$GITHUB_RUN_NUMBER" "uwb-0.1.$GITHUB_RUN_NUMBER.apk" --target "$GITHUB_SHA" \
            --title "0.1.$GITHUB_RUN_NUMBER" \
            --notes "Debug build of ${GITHUB_SHA::7}. Install the APK on both phones. Signing cert $(cat cert.txt)"

      - name: Tell Obtainium about the release
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        continue-on-error: true
        env:
          OBTAINIUM_PUSH_URL: ${{ secrets.OBTAINIUM_PUSH_URL }}
        run: |
          [ -n "$OBTAINIUM_PUSH_URL" ] || exit 0
          curl -fsS -d "https://github.com/${{ github.repository }}" "$OBTAINIUM_PUSH_URL"
